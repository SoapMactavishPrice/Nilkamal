<template>
    <template if:true={isTechSupportModalOpen}>
        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon icon-name="utility:close" onclick={closeTechSupportModal} class="slds-modal__close"></lightning-button-icon>
                    <h2 class="slds-text-heading_medium">Submit Technical Support Comment</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-textarea label="Comment" class="technical-support-comment" value={technicalSupportComments} onchange={handleCommentChange} required>
                    </lightning-textarea>
                    <div class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                        {charCount}/{maxCharCount} characters
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Submit" onclick={submitTechSupport} variant="brand" class="slds-m-right_small" disabled={isSubmitting}>
                    </lightning-button>
                    <lightning-button label="Cancel" variant="neutral" onclick={closeTechSupportModal} disabled={isSubmitting}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showSpinner}>
        <div class="slds-spinner_container">
            <div class="slds-spinner slds-spinner_medium" role="status">
                <span class="slds-spinner__dot-a"></span>
                <span class="slds-spinner__dot-b"></span>
            </div>
        </div>
    </template>
</template>
