<template>
    <div class="slds-modal__container" if:true={visitRecord}>
        <header class="slds-modal__header">
            <span class="slds-modal__close">
                <lightning-icon icon-name="utility:close" alternative-text="close" onclick={handleCloseCreateVisitModal}></lightning-icon>
            </span>
            <h2 class="slds-text-heading_small">
                <a onclick={handleOpenRecord} data-id={selectedCase.id}>{selectedCase.caseNumber}</a>
                &nbsp; - &nbsp;
                <a onclick={handleOpenRecord} data-id={selectedCase.customerId}>{selectedCase.customerName}</a>
            </h2>
        </header>
        <div class="slds-modal__content slds-var-p-horizontal_small">
            <template if:true={showSpinner}>
                <lightning-spinner alternative-text="Loading" variant="brand" size="small"></lightning-spinner>
            </template>
            <lightning-layout multiple-rows>
                <!--  -->
                <template if:true={visitRecord.hasWarning}>
                    <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_warning" role="alert">
                        <span class="slds-assistive-text">warning</span>
                        <span class="slds-icon_container slds-icon-utility-warning slds-m-right_x-small" title="Warning">
                            <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
                                <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#warning"></use>
                            </svg>
                        </span>
                        <h2 style="font-size: larger;">
                            {visitRecord.Warning}
                        </h2>
                    </div>
                </template>
                <!--  -->
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                    <lightning-record-picker object-api-name="Case" value={visitRecord.Case__c} label="Case" disabled></lightning-record-picker>
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                    <lightning-record-picker object-api-name="Account" value={visitRecord.Account__c} label="Account" disabled></lightning-record-picker>
                </lightning-layout-item>
                <!--
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                    <lightning-record-picker name="Work_Order__c" object-api-name="Work_Order__c" value={visitRecord.Work_Order__c} label="Work Order" onchange={handleChange}
                        data-type="RecordPicker" filter={workOrderFilter} disabled></lightning-record-picker>
                </lightning-layout-item>
                -->
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                    <lightning-combobox name="WO_Type__c" value={visitRecord.WO_Type__c} label="Case Type" options={woTypeOptions} onchange={handleChange} disabled></lightning-combobox>
                </lightning-layout-item>
                <!-- <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                    <lightning-combobox name="Status__c" value={visitRecord.Status__c} label="Status" options={statusOptions} onchange={handleChange}></lightning-combobox>
                </lightning-layout-item> -->
                <!--
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                    <lightning-combobox name="Activity__c" value={visitRecord.Activity__c} label="Activity" options={activityOptions} onchange={handleChange}></lightning-combobox>
                </lightning-layout-item>
                -->

                <lightning-layout-item size="12"></lightning-layout-item>

                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                    <lightning-input type="date" name="Assigned_Date__c" value={visitRecord.Assigned_Date__c} label="Case Assigned Date" disabled></lightning-input>
                </lightning-layout-item>
                <!--
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                    <lightning-input type="date" name="Due_Date__c" value={visitRecord.Due_Date__c} label="Expected Visit Date" onchange={handleChange}></lightning-input>
                </lightning-layout-item>
                -->
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                    <lightning-input type="date" name="Scheduled_Start__c" value={visitRecord.Scheduled_Start__c} min={today} label="Scheduled Start" onchange={handleChange}
                        data-name="Scheduled_Start__c"></lightning-input>
                </lightning-layout-item>

                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                    <lightning-input type="checkbox" name="Remote_Support__c" value={visitRecord.Remote_Support__c} label="Remote Support" onchange={handleCheckboxChange}
                        data-name="Remote_Support__c"></lightning-input>
                </lightning-layout-item>
                <!--
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                    <lightning-input type="date" name="Scheduled_End__c" value={visitRecord.Scheduled_End__c} label="Scheduled End" onchange={handleChange}></lightning-input>
                </lightning-layout-item>
                -->
            </lightning-layout>
        </div>
        <div class="slds-modal__footer">
            <lightning-button label="Cancel" variant="neutral" onclick={handleCloseCreateVisitModal}></lightning-button>
            <lightning-button label="Save" variant="brand" class="slds-var-p-left_small" onclick={handleCreateVisit}></lightning-button>
        </div>
    </div>
</template>
