<template>

    <template if:true={showSpinner}>
        <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
    </template>

    <lightning-card variant="narrow" hide-header label="Create Visit">

        <lightning-layout multiple-rows>

            <lightning-layout-item if:false={isMobile} size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="block1">
                <div lwc:dom="manual" class="calendar-container">
                    <!--
                    <div class="calendar-view">
                        <div class="calendar-header-container">
                            <lightning-button-icon icon-name="utility:chevronleft" variant="container" onclick={handlePreviousMonthClick} alternative-text="Prev" title="Previous Month">
                                <div>Prev</div>
                            </lightning-button-icon>
                            <div lwc:dom="manual" class="calendar-month-label"></div>
                            <lightning-button-icon icon-name="utility:chevronright" variant="container" onclick={handleNextMonthClick} alternative-text="Next" title="Next Month">
                                <div>Next</div>
                            </lightning-button-icon>
                        </div>
                        <div class="calendar-week-header">
                            <div class="ellipsis"><span>Mon</span></div>
                            <div class="ellipsis"><span>Tue</span></div>
                            <div class="ellipsis"><span>Wed</span></div>
                            <div class="ellipsis"><span>Thu</span></div>
                            <div class="ellipsis"><span>Fri</span></div>
                            <div class="ellipsis"><span>Sat</span></div>
                            <div class="ellipsis"><span>Sun</span></div>
                        </div>
                        <div class="calendar-days-view">
                            <div lwc:dom="manual" class="calendar-days-container drop-target-parent"></div>
                        </div>
                    </div>
                    -->
                </div>
            </lightning-layout-item>

            <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="block2">

                <template if:true={isMobile}>
                    <div class="calendar-header-container" style="padding-top: 10px; padding-bottom: 10px">
                        <lightning-button-icon icon-name="utility:chevronleft" variant="container" onclick={handlePreviousDayClick} alternative-text="Prev" title="Previous Day">
                            <div>Prev</div>
                        </lightning-button-icon>
                        <div class="day-label" onclick={handleDateClick}>
                            <div>{selectedDate}</div>
                            <div>
                                <lightning-button-icon icon-name="utility:date_input" variant="container" alternative-text="Calendar" title="Calendar"></lightning-button-icon>
                            </div>
                        </div>
                        <lightning-button-icon icon-name="utility:chevronright" variant="container" onclick={handleNextDayClick} alternative-text="Next" title="Next Day">
                            <div>Next</div>
                        </lightning-button-icon>
                    </div>

                    <template if:true={showCalendarOverlay}>
                        <div class="slds-is-relative">
                            <div class={calendarOverlayClass}>
                                <button class="calendar-close-btn" onclick={handleCloseCalendar}>X</button>
                                <div lwc:dom="manual" class="calendar-container"></div>
                            </div>
                        </div>
                        <div class="slds-backdrop slds-backdrop_open" onclick={handleCloseCalendar}></div>
                    </template>
                </template>

                <div class="open-cases-container">
                    <div class="open-cases-header">Open Cases</div>
                    <div class="open-cases-table">
                        <template lwc:if={openCasesList}>
                            <!-- openCasesSortDirection - {openCasesSortDirection} = openCasesSortBy - {openCasesSortBy} -->

                            <!--
                            <lightning-datatable columns={openCasesColumns} data={openCasesList} key-field="id" show-row-number-column hide-checkbox-column
                                default-sort-direction={openCasesSortDirection} sorted-direction={openCasesSortDirection} sorted-by={openCasesSortBy} onsort={handleOpenCasesHandleSort}
                                onrowaction={handleOpenCasesRowAction} min-column-width="100"></lightning-datatable>
                            -->

                            <table class="slds-table slds-table_bordered slds-no-row-hover">
                                <thead class="slds-line-height_reset">
                                    <tr class="slds-hint-parent">
                                        <th class="slds-text-title_caps">
                                            <div class="horizontal-flex" style="justify-content: space-between; cursor: pointer" onclick={handleOpenCasesSort} data-field="caseNumber">
                                                <span>Case No</span>
                                                <template lwc:if={openCasesColumns.caseNumber.isAsc}><lightning-icon icon-name="utility:arrowup" size="xx-small"></lightning-icon></template>
                                                <template lwc:elseif={openCasesColumns.caseNumber.isDesc}><lightning-icon icon-name="utility:arrowdown" size="xx-small"></lightning-icon></template>
                                                <template lwc:else><lightning-icon icon-name="utility:sort" size="xx-small"></lightning-icon></template>
                                            </div>
                                        </th>
                                        <th class="slds-text-title_caps">
                                            <div class="horizontal-flex" style="justify-content: space-between; cursor: pointer" onclick={handleOpenCasesSort} data-field="totalServiceAppointments">
                                                <span>SA</span>
                                                <template lwc:if={openCasesColumns.totalServiceAppointments.isAsc}><lightning-icon icon-name="utility:arrowup"
                                                        size="xx-small"></lightning-icon></template>
                                                <template lwc:elseif={openCasesColumns.totalServiceAppointments.isDesc}><lightning-icon icon-name="utility:arrowdown"
                                                        size="xx-small"></lightning-icon></template>
                                                <template lwc:else><lightning-icon icon-name="utility:sort" size="xx-small"></lightning-icon></template>
                                            </div>
                                        </th>
                                        <th class="slds-text-title_caps">Customer</th>
                                        <th class="slds-text-title_caps">Serial No</th>
                                        <th class="slds-text-title_caps">
                                            <div class="horizontal-flex" style="justify-content: space-between; cursor: pointer" onclick={handleOpenCasesSort} data-field="priority">
                                                <span>Priority</span>
                                                <template lwc:if={openCasesColumns.priority.isAsc}><lightning-icon icon-name="utility:arrowup" size="xx-small"></lightning-icon></template>
                                                <template lwc:elseif={openCasesColumns.priority.isDesc}><lightning-icon icon-name="utility:arrowdown" size="xx-small"></lightning-icon></template>
                                                <template lwc:else><lightning-icon icon-name="utility:sort" size="xx-small"></lightning-icon></template>
                                            </div>
                                        </th>
                                        <th class="slds-text-title_caps">
                                            <div class="horizontal-flex" style="justify-content: space-between; cursor: pointer" onclick={handleOpenCasesSort} data-field="type">
                                                <span>Type</span>
                                                <template lwc:if={openCasesColumns.type.isAsc}><lightning-icon icon-name="utility:arrowup" size="xx-small"></lightning-icon></template>
                                                <template lwc:elseif={openCasesColumns.type.isDesc}><lightning-icon icon-name="utility:arrowdown" size="xx-small"></lightning-icon></template>
                                                <template lwc:else><lightning-icon icon-name="utility:sort" size="xx-small"></lightning-icon></template>
                                            </div>
                                        </th>
                                        <th class="slds-text-title_caps">
                                            <div class="horizontal-flex" style="justify-content: space-between; cursor: pointer" onclick={handleOpenCasesSort} data-field="assignedDateTime">
                                                <span>Assigned Date</span>
                                                <template lwc:if={openCasesColumns.assignedDateTime.isAsc}><lightning-icon icon-name="utility:arrowup" size="xx-small"></lightning-icon></template>
                                                <template lwc:elseif={openCasesColumns.assignedDateTime.isDesc}><lightning-icon icon-name="utility:arrowdown"
                                                        size="xx-small"></lightning-icon></template>
                                                <template lwc:else><lightning-icon icon-name="utility:sort" size="xx-small"></lightning-icon></template>
                                            </div>
                                        </th>
                                        <th class="slds-text-title_caps">
                                            <div class="horizontal-flex" style="justify-content: space-between; cursor: pointer" onclick={handleOpenCasesSort} data-field="noOfDaysOpen">
                                                <span>No of days open</span>
                                                <template lwc:if={openCasesColumns.noOfDaysOpen.isAsc}><lightning-icon icon-name="utility:arrowup" size="xx-small"></lightning-icon></template>
                                                <template lwc:elseif={openCasesColumns.noOfDaysOpen.isDesc}><lightning-icon icon-name="utility:arrowdown" size="xx-small"></lightning-icon></template>
                                                <template lwc:else><lightning-icon icon-name="utility:sort" size="xx-small"></lightning-icon></template>
                                            </div>
                                        </th>
                                        <!-- <th class="slds-text-title_caps small-col"></th> -->
                                    </tr>
                                </thead>
                                <tbody>
                                    <template iterator:item={openCasesList}>
                                        <tr key={item.value.id} class="slds-hint-parent">
                                            <td class="slds-truncate slds-cell-wrap" onclick={handleCaseCreateVisitClick} data-index={item.index} data-id={item.value.id}>
                                                <a>{item.value.caseNumber}</a>
                                            </td>
                                            <td class="slds-truncate slds-cell-wrap ">
                                                <label class="totalAppointment">{item.value.totalServiceAppointments}</label>
                                            </td>
                                            <td class="slds-truncate slds-cell-wrap truncate" title={item.value.customerName} onclick={toggleDescription}>{item.value.customerName}</td>
                                            <td class="slds-truncate slds-cell-wrap user-select-all">{item.value.serialNumber}</td>
                                            <td class="slds-truncate slds-cell-wrap">{item.value.priority}</td>
                                            <td class="slds-truncate slds-cell-wrap">{item.value.type}</td>
                                            <td class="slds-truncate slds-cell-wrap">
                                                <lightning-formatted-date-time value={item.value.assignedDateTime} day="2-digit" month="2-digit" year="2-digit"></lightning-formatted-date-time>
                                            </td>
                                            <td class="slds-truncate slds-cell-wrap slds-text-align_center">{item.value.noOfDaysOpen}</td>
                                            <!--
                                            <td class="slds-truncate slds-cell-wrap">
                                                <lightning-icon icon-name="utility:add" title="Create Visit" label="Create Visit" size="small" onclick={handleCaseCreateVisitClick}
                                                    alternative-text="Create Visit" data-index={item.index} data-id={item.value.id}></lightning-icon>
                                            </td>
                                            -->
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template lwc:else>
                            <lightning-layout>
                                <lightning-layout-item size="2" small-device-size="2" medium-device-size="3" large-device-size="3">
                                </lightning-layout-item>
                                <lightning-layout-item size="8" small-device-size="8" medium-device-size="6" large-device-size="6">
                                    <img src="/img/chatter/OpenRoad.svg" class="slds-illustration__svg slds-var-p-around_large" />
                                </lightning-layout-item>
                                <lightning-layout-item size="2" small-device-size="2" medium-device-size="6" large-device-size="3">
                                </lightning-layout-item>
                            </lightning-layout>
                        </template>
                    </div>
                </div>

                <div class="open-service-appointments-container slds-var-p-top_small">
                    <div class="open-service-appointments-header">Open Service Appointments</div>
                    <div class="open-service-appointments-table">
                        <template lwc:if={visibleServiceAppointmentsList}>
                            <table class="slds-table slds-table_bordered slds-no-row-hover">
                                <thead class="slds-line-height_reset">
                                    <tr class="slds-hint-parent">
                                        <th class="slds-text-title_caps">Case No</th>
                                        <th class="slds-text-title_caps">Customer</th>
                                        <th class="slds-text-title_caps">Serial No</th>
                                        <th class="slds-text-title_caps">Type</th>
                                        <!-- <th class="slds-text-title_caps">Scheduled Start</th> -->
                                        <!-- <th class="slds-text-title_caps small-col"></th> -->
                                    </tr>
                                </thead>
                                <tbody>
                                    <template iterator:item={visibleServiceAppointmentsList}>
                                        <tr key={item.value.id} class="slds-hint-parent">
                                            <td class="slds-truncate slds-cell-wrap case-number-sa-number" data-checked={item.value.isCheckedIn}>
                                                <a onclick={handleServiceAppointmentPreviewClick} data-index={item.index} data-id={item.value.id}>
                                                    <div>
                                                        {item.value.caseNumber} {item.value.name}
                                                        <span if:true={item.value.remoteSupport}> (R)</span>
                                                        <span if:true={item.value.isAdditionalResource}> (AR)</span>
                                                    </div>
                                                </a>
                                            </td>
                                            <td class="slds-truncate slds-cell-wrap truncate" title={item.value.custName} onclick={toggleDescription}>{item.value.custName}</td>
                                            <td class="slds-truncate slds-cell-wrap user-select-all">{item.value.serialNumber}</td>
                                            <td class="slds-truncate slds-cell-wrap">{item.value.woType}</td>
                                            <!--
                                            <td class="slds-truncate slds-cell-wrap">
                                                <lightning-formatted-date-time value={item.value.planDate} day="2-digit" month="2-digit" year="2-digit" hour="2-digit" minute="2-digit"
                                                    hour12="false"></lightning-formatted-date-time>
                                            </td>
                                            -->
                                            <!--
                                            <td class="slds-truncate slds-cell-wrap">
                                                <lightning-icon icon-name="utility:preview" title="Preview Service Appointment" label="Preview Service Appointment" size="small"
                                                    onclick={handleServiceAppointmentPreviewClick} data-index={item.index} data-id={item.value.id}></lightning-icon>
                                            </td>
                                            -->
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template lwc:else>
                            <lightning-layout>
                                <lightning-layout-item size="2" small-device-size="2" medium-device-size="3" large-device-size="3">
                                </lightning-layout-item>
                                <lightning-layout-item size="8" small-device-size="8" medium-device-size="6" large-device-size="6">
                                    <img src="/img/chatter/OpenRoad.svg" class="slds-illustration__svg slds-var-p-around_large" />
                                </lightning-layout-item>
                                <lightning-layout-item size="2" small-device-size="2" medium-device-size="6" large-device-size="3">
                                </lightning-layout-item>
                            </lightning-layout>
                        </template>
                    </div>
                </div>

            </lightning-layout-item>

        </lightning-layout>

    </lightning-card>



    <template if:true={showCreateVisitModal}>
        <div class="custom-modal">
            <section role="dialog" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <span class="slds-modal__close">
                            <lightning-icon icon-name="utility:close" alternative-text="close" onclick={handleCloseCreateVisitModal}></lightning-icon>
                        </span>
                        <h2 class="slds-text-heading_small">
                            <a onclick={handleOpenRecord} data-id={selectedCase.id}>{selectedCase.caseNumber}</a>
                            &nbsp; - &nbsp;
                            <a onclick={handleOpenRecord} data-id={selectedCase.customerId}>{selectedCase.customerName}</a>
                        </h2>
                    </header>
                    <div class="slds-modal__content slds-var-p-horizontal_small">
                        <template if:true={showSpinner}>
                            <lightning-spinner alternative-text="Loading" variant="brand" size="small"></lightning-spinner>
                        </template>
                        <lightning-layout multiple-rows>
                            <!--  -->
                            <template if:true={visitRecord.hasWarning}>
                                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_warning" role="alert">
                                    <span class="slds-assistive-text">warning</span>
                                    <span class="slds-icon_container slds-icon-utility-warning slds-m-right_x-small" title="Warning">
                                        <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
                                            <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#warning"></use>
                                        </svg>
                                    </span>
                                    <h2 style="font-size: larger;">
                                        {visitRecord.Warning}
                                    </h2>
                                </div>
                            </template>
                            <!--  -->
                            <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                                <lightning-record-picker object-api-name="Case" value={visitRecord.Case__c} label="Case" disabled></lightning-record-picker>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                                <lightning-record-picker object-api-name="Account" value={visitRecord.Account__c} label="Account" disabled></lightning-record-picker>
                            </lightning-layout-item>
                            <!--
                            <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                                <lightning-record-picker name="Work_Order__c" object-api-name="Work_Order__c" value={visitRecord.Work_Order__c} label="Work Order" onchange={handleChange}
                                    data-type="RecordPicker" filter={workOrderFilter} disabled></lightning-record-picker>
                            </lightning-layout-item>
                            -->
                            <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                                <lightning-combobox name="WO_Type__c" value={visitRecord.WO_Type__c} label="Case Type" options={woTypeOptions} onchange={handleChange} disabled></lightning-combobox>
                            </lightning-layout-item>
                            <!-- <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                                <lightning-combobox name="Status__c" value={visitRecord.Status__c} label="Status" options={statusOptions} onchange={handleChange}></lightning-combobox>
                            </lightning-layout-item> -->
                            <!--
                            <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                                <lightning-combobox name="Activity__c" value={visitRecord.Activity__c} label="Activity" options={activityOptions} onchange={handleChange}></lightning-combobox>
                            </lightning-layout-item>
                            -->

                            <lightning-layout-item size="12"></lightning-layout-item>

                            <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                                <lightning-input type="date" name="Assigned_Date__c" value={visitRecord.Assigned_Date__c} label="Case Assigned Date" disabled></lightning-input>
                            </lightning-layout-item>
                            <!--
                            <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                                <lightning-input type="date" name="Due_Date__c" value={visitRecord.Due_Date__c} label="Expected Visit Date" onchange={handleChange}></lightning-input>
                            </lightning-layout-item>
                            -->
                            <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                                <lightning-input type="date" name="Scheduled_Start__c" value={visitRecord.Scheduled_Start__c} min={today} label="Scheduled Start" onchange={handleChange}
                                    data-name="Scheduled_Start__c"></lightning-input>
                            </lightning-layout-item>

                            <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                                <lightning-input type="checkbox" name="Remote_Support__c" value={visitRecord.Remote_Support__c} label="Remote Support" onchange={handleCheckboxChange}
                                    data-name="Remote_Support__c"></lightning-input>
                            </lightning-layout-item>
                            <!--
                            <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-around_xx-small">
                                <lightning-input type="date" name="Scheduled_End__c" value={visitRecord.Scheduled_End__c} label="Scheduled End" onchange={handleChange}></lightning-input>
                            </lightning-layout-item>
                            -->
                        </lightning-layout>
                    </div>
                    <div class="slds-modal__footer">
                        <lightning-button label="Cancel" variant="neutral" onclick={handleCloseCreateVisitModal}></lightning-button>
                        <lightning-button label="Save" variant="brand" class="slds-var-p-left_small" onclick={handleCreateVisit}></lightning-button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </div>
    </template>



    <template if:true={showServiceAppointmentInfoModal}>
        <div class="custom-modal">
            <section role="dialog" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <span class="slds-modal__close">
                            <lightning-icon icon-name="utility:close" alternative-text="close" onclick={handleCloseServiceAppointmentInfoModal}></lightning-icon>
                        </span>
                        <h2 class="slds-text-heading_small slds-hyphenate">
                            <a onclick={handleOpenRecord} data-id={selectedServiceAppointment.caseId}>{selectedServiceAppointment.caseNumber}</a>
                            &nbsp;&nbsp; - &nbsp;&nbsp;

                            <a onclick={handleOpenRecord} data-id={selectedServiceAppointment.id}>{selectedServiceAppointment.name}</a>
                        </h2>
                    </header>
                    <div class="slds-modal__content">
                        <c-field-service-work-order-service-app-info record-id={selectedServiceAppointment.Id}
                            onclose={handleCloseServiceAppointmentInfoModal}></c-field-service-work-order-service-app-info>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </div>
    </template>


</template>
