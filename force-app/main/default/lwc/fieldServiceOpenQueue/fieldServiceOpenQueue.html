<template>
    <lightning-card title="Case List" icon-name="standard:case">
        <template if:true={cases}>
            <lightning-layout multiple-rows class="slds-m-around_medium slds-p-around_medium slds-grid_gray">
                <template for:each={cases} for:item="caseRecord">
                    <lightning-layout-item key={caseRecord.Id} class="slds-col slds-size_3-of-3 slds-small-size_1-of-1">
                        <div class="case-card slds-box slds-box_xx-small">
                            <p>
                                <strong>
                                    <a href="javascript:void(0);" data-id={caseRecord.Id} onclick={handleCaseClick}>
                                        Case #{caseRecord.CaseNumber}
                                    </a>
                                </strong>
                            </p>
                            <p>Description: {caseRecord.Description}</p>
                            <p>Client: {caseRecord.clientName}</p>
                            <div class="slds-text-align_right">
                                <lightning-button label="Accept"
                                                  data-id={caseRecord.Id}
                                                  onclick={handleAccept}
                                                  variant="brand">
                                </lightning-button>
                            </div>
                        </div>
                    </lightning-layout-item>
                </template>
            </lightning-layout>

            <div class="slds-text-align_center slds-m-top_medium">
                <lightning-button label="Previous" onclick={handlePreviousPage} disabled={isFirstPage}></lightning-button>
                <lightning-button label="Next" onclick={handleNextPage} disabled={isLastPage}></lightning-button>
            </div>
        </template>

        <template if:false={casesToDisplay}>
            <p>No cases assigned to you.</p>
        </template>
  <!-- Modal rendering conditionally -->
  <template if:true={isModalOpen}>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <h2 class="slds-text-heading_medium">Case Details</h2>
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                </button>
            </header>
            <div class="slds-modal__content slds-p-around_medium">
                <p><strong>Client Name:</strong> {modalData.clientName}</p>
                <p><strong>Email:</strong> {modalData.clientEmail}</p>
                <p><strong>Phone:</strong> {modalData.clientPhone}</p>
                <p><strong>Description:</strong> {modalData.description}</p>
            </div>
            <footer class="slds-modal__footer">
                <lightning-button label="Close" onclick={closeModal}></lightning-button>
                <lightning-button label="Accept" data-id={modalData.Id} variant="brand" onclick={handleAccept}></lightning-button>
                <lightning-button label="Reject" variant="destructive" onclick={handleReject}></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
