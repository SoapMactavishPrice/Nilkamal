<template>
    <lightning-card>
        <div class="container">
            <template if:false={showIllustration}>
                <div class="header">
                    <h2>Asset History / Timeline</h2>
                </div>
                <div class="info">
                    <p><span class="info-label">Sr No:</span> <span class="info-value">{assets.SerialNumber}</span></p>
                    <p><span class="info-label">Owner:</span> <span class="info-value"></span>{assets.OwnerName}</p>
                    <p>
                        <span class="info-label">Warranty:</span>
                        <span class="info-value"></span>
                        <template if:false={isWarrantyAvailable}>
                            No Warranty Available.
                        </template>
                        <template for:each={assets.Warranties} for:item="Warranty">
                            <span class="info-dates" key={Warranty.id}>
                                <template if:true={Warranty.isActive}>
                                    <span class="info-value">{Warranty.status}</span>
                                </template>
                                <template if:false={Warranty.isActive}>
                                    <span class="info-value">{Warranty.status} To&nbsp;<lightning-formatted-date-time value={Warranty.WarrantyEndDate}></lightning-formatted-date-time></span>
                                </template>
                                <br />
                                <span class="info-label"></span>
                                <span if:true={Warranty.isActive}>
                                    <lightning-formatted-date-time value={Warranty.WarrantyStartDate}></lightning-formatted-date-time> To&nbsp;
                                    <lightning-formatted-date-time value={Warranty.WarrantyEndDate}></lightning-formatted-date-time>
                                </span>
                                <span class="info-label"></span>
                            </span>
                        </template>
                    </p>
                    <p>
                        <span class="info-label">AMC:</span>
                        <template for:each={assets.AMCs} for:item="AMC">
                            <span class="info-dates" key={AMC.id}>
                                <span class="info-value">{AMC.status}</span>
                                <br />
                                <span class="info-label"></span>
                                <lightning-formatted-date-time value={AMC.AMCStartDate} style=""></lightning-formatted-date-time> To&nbsp;
                                <lightning-formatted-date-time value={AMC.AMCEndDate} style=""></lightning-formatted-date-time>
                            </span>
                        </template>
                        <br />
                        <span class="info-label"></span> <span class="info-dates"></span>
                    </p>
                </div>
            </template>
