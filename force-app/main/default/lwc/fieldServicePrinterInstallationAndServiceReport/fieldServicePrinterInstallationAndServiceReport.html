<template>
    <template if:true={showSpinner}>
        <lightning-spinner alternative-text="Loading" variant="brand" size="medium"></lightning-spinner>
    </template>
    <template if:true={showInstallationReport}>
        <div class="container-max-width">
            <lightning-card title="Installation Report">
                <lightning-record-edit-form if:true={installationReportRecord} object-api-name="Installation_Report__c" record-id={installationReportRecord.Id} onload={handleOnLoad}>

                    <!-- CIJ Installation Report UI -->
                    <template lwc:if={isCIJ}>
                        <lightning-layout pull-to-boundary="stretch" vertical-align="start" multiple-rows>

                        <!-- Basic Information Section -->
                        <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small">
                            <lightning-card title="Basic Information" icon-name="utility:info">
                                <lightning-layout multiple-rows>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-output-field if:true={installationReportRecord.IsSavedByUser__c} field-name="Name" variant="label-stacked"></lightning-output-field>
                                        <lightning-input if:false={installationReportRecord.IsSavedByUser__c} label="Installation Document Number" variant="label-stacked" required
                                            disabled></lightning-input>
                                    </lightning-layout-item>
                                    <!-- <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field field-name="Serial_Number__c" variant="label-stacked" value={installationReportRecord.Serial_Number__c}
                                            onchange={handleChange}></lightning-input-field>
                                    </lightning-layout-item> -->
                                    <!-- <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field field-name="Date__c" variant="label-stacked" value={installationReportRecord.Date__c} onchange={handleChange}></lightning-input-field>
                                    </lightning-layout-item> -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field class="readonly-field" field-name="Party_Code__c" variant="label-stacked" required
                                            value={installationReportRecord.Party_Code__c} onchange={handleChange} disabled>
                                        </lightning-input-field>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field class="readonly-field" field-name="Customer_Name__c" variant="label-stacked" required
                                            value={installationReportRecord.Customer_Name__c} onchange={handleChange} disabled>
                                        </lightning-input-field>
                                    </lightning-layout-item>
                                    <!-- <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field field-name="Contact_Person_Name__c" variant="label-stacked" value={installationReportRecord.Contact_Person_Name__c}
                                            onchange={handleChange}></lightning-input-field>
                                    </lightning-layout-item> -->
                                    <!-- <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field field-name="Contact_Person_Number__c" variant="label-stacked" value={installationReportRecord.Contact_Person_Number__c}
                                            onchange={handleChange}></lightning-input-field>
                                    </lightning-layout-item> -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field class="readonly-field" field-name="Location__c" variant="label-stacked"
                                            value={installationReportRecord.Location__c} onchange={handleChange} disabled>
                                        </lightning-input-field>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input label="Contact Person" variant="label-stacked" value={installationContactPerson} disabled
                                            class="readonly-field">
                                        </lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input label="Contact No." variant="label-stacked" value={installationContactNumber} disabled
                                            class="readonly-field">
                                        </lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </lightning-card>
                        </lightning-layout-item>

                        <!-- Printer Details Section -->
                        <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small">
                            <lightning-card title="Printer Details" icon-name="utility:print">
                                <lightning-layout multiple-rows>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field class="readonly-field" required={isCIJ} field-name="Printer_Model__c" variant="label-stacked" value={installationReportRecord.Printer_Model__c}
                                            onchange={handleChange} disabled></lightning-input-field>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field class="readonly-field" required={isCIJ} field-name="Printer_Serial_Number__c" variant="label-stacked" value={installationReportRecord.Printer_Serial_Number__c}
                                            onchange={handleChange} disabled></lightning-input-field>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-combobox
                                            label="Ink Part No"
                                            required={isCIJ}
                                            variant="label-stacked"
                                            value={installationReportRecord.Ink_Part_No__c}
                                            options={inkPartNoOptions}
                                            onchange={handleInkPartNoChange}
                                            placeholder="Select Ink Part No">
                                        </lightning-combobox>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field required={isCIJ} field-name="Ink_Exp_Date__c" variant="label-stacked" value={installationReportRecord.Ink_Exp_Date__c}
                                            onchange={handleChange}></lightning-input-field>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-combobox
                                            label="Make Up Part No"
                                            required={isCIJ}
                                            variant="label-stacked"
                                            value={installationReportRecord.Make_Up_Part_No__c}
                                            options={inkPartNoOptions}
                                            onchange={handleMakeUpPartNoChange}
                                            placeholder="Select Make Up Part No">
                                        </lightning-combobox>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field required={isCIJ} field-name="Make_Up_Exp_Date__c" variant="label-stacked" value={installationReportRecord.Make_Up_Exp_Date__c}
                                            onchange={handleChange}></lightning-input-field>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input name="Software_No__c" label="Software No" variant="label-stacked" required={isCIJ}
                                            value={installationReportRecord.Software_No__c} onchange={handleChange}
                                            pattern="^[a-zA-Z0-9\s\-\_\.\/\#\@\&\!\$\*\(\)\[\]\{\}]+$"
                                            message-when-pattern-mismatch="Only alphanumeric characters and special characters are allowed">
                                        </lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input name="Nozzle_Serial_No__c" label="Nozzle Serial No" variant="label-stacked" required={isCIJ}
                                            value={installationReportRecord.Nozzle_Serial_No__c} onchange={handleChange}
                                            pattern="^[a-zA-Z0-9\s\-\_\.\/\#\@\&\!\$\*\(\)\[\]\{\}]+$"
                                            message-when-pattern-mismatch="Only alphanumeric characters and special characters are allowed">
                                        </lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </lightning-card>
                        </lightning-layout-item>

                        <!-- Physical Check Section -->
                        <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small">
                            <lightning-card title="Physical Check / If Missing / Damage" icon-name="utility:check">
                                <lightning-layout multiple-rows>
                                    <!-- Print Head Stand Field -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field required={isCIJ} field-name="Print_Head_Stand__c" variant="label-stacked" value={installationReportRecord.Print_Head_Stand__c}
                                            onchange={handleChange}></lightning-input-field>
                                    </lightning-layout-item>
                                    <!-- Print Head Stand Image Upload (shown when Not OK) -->
                                    <template if:true={isPrintHeadStandNotOK}>
                                        <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="8" class="slds-var-p-horizontal_x-small">
                                            <div class="slds-var-m-top_large">
                                                <lightning-input type="file" label="Upload Image" accept=".jpg,.jpeg,.png,.gif,.bmp" onchange={handleFileUpload} data-section="printheadstand"
                                                    class="slds-var-m-bottom_small">
                                                </lightning-input>
                                                <template if:true={printHeadStandImages.length}>
                                                    <div class="slds-grid slds-wrap slds-gutters_x-small">
                                                        <template for:each={printHeadStandImages} for:item="image">
                                                            <div key={image.id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" style="position: relative;">
                                                                <div class="slds-card" style="padding: 4px;">
                                                                    <img src={image.previewUrl} alt="Print Head Stand" style="width: 100%; max-width: 150px; height: auto; border: 1px solid #ddd; border-radius: 4px;" />
                                                                    <div style="position: absolute; top: 4px; right: 4px;">
                                                                        <lightning-button-icon icon-name="utility:delete" variant="bare" alternative-text="Delete" onclick={handleDeleteImage}
                                                                            data-id={image.id} data-section="printheadstand" size="x-small">
                                                                        </lightning-button-icon>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </lightning-layout-item>
                                    </template>

                                    <!-- Printer Stand Field -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field required={isCIJ} field-name="Printer_Stand__c" variant="label-stacked" value={installationReportRecord.Printer_Stand__c}
                                            onchange={handleChange}></lightning-input-field>
                                    </lightning-layout-item>
                                    <!-- Printer Stand Image Upload (shown when Not OK) -->
                                    <template if:true={isPrinterStandNotOK}>
                                        <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="8" class="slds-var-p-horizontal_x-small">
                                            <div class="slds-var-m-top_large">
                                                <lightning-input type="file" label="Upload Image" accept=".jpg,.jpeg,.png,.gif,.bmp" onchange={handleFileUpload} data-section="printerstand"
                                                    class="slds-var-m-bottom_small">
                                                </lightning-input>
                                                <template if:true={printerStandImages.length}>
                                                    <div class="slds-grid slds-wrap slds-gutters_x-small">
                                                        <template for:each={printerStandImages} for:item="image">
                                                            <div key={image.id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" style="position: relative;">
                                                                <div class="slds-card" style="padding: 4px;">
                                                                    <img src={image.previewUrl} alt="Printer Stand" style="width: 100%; max-width: 150px; height: auto; border: 1px solid #ddd; border-radius: 4px;" />
                                                                    <div style="position: absolute; top: 4px; right: 4px;">
                                                                        <lightning-button-icon icon-name="utility:delete" variant="bare" alternative-text="Delete" onclick={handleDeleteImage}
                                                                            data-id={image.id} data-section="printerstand" size="x-small">
                                                                        </lightning-button-icon>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </lightning-layout-item>
                                    </template>

                                    <!-- Tool Box Field -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field required={isCIJ} field-name="Tool_Box__c" variant="label-stacked" value={installationReportRecord.Tool_Box__c}
                                            onchange={handleChange}></lightning-input-field>
                                    </lightning-layout-item>
                                    <!-- Tool Box Image Upload (shown when Not OK) -->
                                    <template if:true={isToolBoxNotOK}>
                                        <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="8" class="slds-var-p-horizontal_x-small">
                                            <div class="slds-var-m-top_large">
                                                <lightning-input type="file" label="Upload Image" accept=".jpg,.jpeg,.png,.gif,.bmp" onchange={handleFileUpload} data-section="toolbox"
                                                    class="slds-var-m-bottom_small">
                                                </lightning-input>
                                                <template if:true={toolBoxImages.length}>
                                                    <div class="slds-grid slds-wrap slds-gutters_x-small">
                                                        <template for:each={toolBoxImages} for:item="image">
                                                            <div key={image.id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" style="position: relative;">
                                                                <div class="slds-card" style="padding: 4px;">
                                                                    <img src={image.previewUrl} alt="Tool Box" style="width: 100%; max-width: 150px; height: auto; border: 1px solid #ddd; border-radius: 4px;" />
                                                                    <div style="position: absolute; top: 4px; right: 4px;">
                                                                        <lightning-button-icon icon-name="utility:delete" variant="bare" alternative-text="Delete" onclick={handleDeleteImage}
                                                                            data-id={image.id} data-section="toolbox" size="x-small">
                                                                        </lightning-button-icon>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </lightning-layout-item>
                                    </template>

                                    <!-- Printer Manual Field -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field required={isCIJ} field-name="Printer_Manual__c" variant="label-stacked" value={installationReportRecord.Printer_Manual__c}
                                            onchange={handleChange}></lightning-input-field>
                                    </lightning-layout-item>
                                    <!-- Printer Manual Image Upload (shown when Not OK) -->
                                    <template if:true={isPrinterManualNotOK}>
                                        <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="8" class="slds-var-p-horizontal_x-small">
                                            <div class="slds-var-m-top_large">
                                                <lightning-input type="file" label="Upload Image" accept=".jpg,.jpeg,.png,.gif,.bmp" onchange={handleFileUpload} data-section="printermanual"
                                                    class="slds-var-m-bottom_small">
                                                </lightning-input>
                                                <template if:true={printerManualImages.length}>
                                                    <div class="slds-grid slds-wrap slds-gutters_x-small">
                                                        <template for:each={printerManualImages} for:item="image">
                                                            <div key={image.id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" style="position: relative;">
                                                                <div class="slds-card" style="padding: 4px;">
                                                                    <img src={image.previewUrl} alt="Printer Manual" style="width: 100%; max-width: 150px; height: auto; border: 1px solid #ddd; border-radius: 4px;" />
                                                                    <div style="position: absolute; top: 4px; right: 4px;">
                                                                        <lightning-button-icon icon-name="utility:delete" variant="bare" alternative-text="Delete" onclick={handleDeleteImage}
                                                                            data-id={image.id} data-section="printermanual" size="x-small">
                                                                        </lightning-button-icon>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </lightning-layout-item>
                                    </template>

                                    <!-- Sensor Field -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field required={isCIJ} field-name="Sensor__c" variant="label-stacked" value={installationReportRecord.Sensor__c}
                                            onchange={handleChange}></lightning-input-field>
                                    </lightning-layout-item>
                                    <!-- Sensor Image Upload (shown when Not OK) -->
                                    <template if:true={isSensorNotOK}>
                                        <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="8" class="slds-var-p-horizontal_x-small">
                                            <div class="slds-var-m-top_large">
                                                <lightning-input type="file" label="Upload Image" accept=".jpg,.jpeg,.png,.gif,.bmp" onchange={handleFileUpload} data-section="sensor"
                                                    class="slds-var-m-bottom_small">
                                                </lightning-input>
                                                <template if:true={sensorImages.length}>
                                                    <div class="slds-grid slds-wrap slds-gutters_x-small">
                                                        <template for:each={sensorImages} for:item="image">
                                                            <div key={image.id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" style="position: relative;">
                                                                <div class="slds-card" style="padding: 4px;">
                                                                    <img src={image.previewUrl} alt="Sensor" style="width: 100%; max-width: 150px; height: auto; border: 1px solid #ddd; border-radius: 4px;" />
                                                                    <div style="position: absolute; top: 4px; right: 4px;">
                                                                        <lightning-button-icon icon-name="utility:delete" variant="bare" alternative-text="Delete" onclick={handleDeleteImage}
                                                                            data-id={image.id} data-section="sensor" size="x-small">
                                                                        </lightning-button-icon>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </lightning-layout-item>
                                    </template>
                                </lightning-layout>
                            </lightning-card>
                        </lightning-layout-item>

                        <!-- Input AC Voltage Section -->
                        <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small">
                            <lightning-card title="Input AC Voltage" icon-name="utility:power">
                                <lightning-layout multiple-rows>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input name="L_N_volt__c" label="L & N, volt." type="number" variant="label-stacked" required={isCIJ}
                                            value={installationReportRecord.L_N_volt__c} onchange={handleChange}>
                                        </lightning-input>
                                        <template if:true={fieldValidationErrors.L_N_volt__c}>
                                            <div class="slds-text-color_error slds-var-m-top_xx-small" style="font-size: 0.75rem;">
                                                {fieldValidationErrors.L_N_volt__c}
                                            </div>
                                        </template>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field required={isCIJ} field-name="N_G_volt__c" variant="label-stacked" value={installationReportRecord.N_G_volt__c}
                                            onchange={handleChange}></lightning-input-field>
                                        <template if:true={fieldValidationErrors.N_G_volt__c}>
                                            <div class="slds-text-color_error slds-var-m-top_xx-small" style="font-size: 0.75rem;">
                                                {fieldValidationErrors.N_G_volt__c}
                                            </div>
                                        </template>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field required={isCIJ} field-name="G_L_volt__c" variant="label-stacked" value={installationReportRecord.G_L_volt__c}
                                            onchange={handleChange}></lightning-input-field>
                                        <template if:true={fieldValidationErrors.G_L_volt__c}>
                                            <div class="slds-text-color_error slds-var-m-top_xx-small" style="font-size: 0.75rem;">
                                                {fieldValidationErrors.G_L_volt__c}
                                            </div>
                                        </template>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </lightning-card>
                        </lightning-layout-item>

                        <!-- Equipment Status Section (CIJ commissioning layout) -->
                        <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small">
                            <lightning-card title="Equipment Status" icon-name="utility:settings">
                                <lightning-layout multiple-rows>
                                    <!-- UPS / Earthing row -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field required={isCIJ} field-name="UPS__c" variant="label-stacked"
                                            value={installationReportRecord.UPS__c} onchange={handleChange}>
                                        </lightning-input-field>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field required={isCIJ} field-name="Earthing__c" variant="label-stacked"
                                            value={installationReportRecord.Earthing__c} onchange={handleChange}>
                                        </lightning-input-field>
                                    </lightning-layout-item>

                                    <!-- Earthing Image Upload (shown when Earthing is not OK) -->
                                    <template if:true={showInstallationReport}>
                                        <template if:true={isCIJ}>
                                            <template if:true={isEarthingOK}>
                                                <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small">
                                                    <lightning-card title="Earthing Image Upload">
                                                        <div class="slds-var-m-vertical_medium">
                                                            <!-- File Upload -->
                                                            <lightning-input type="file" label="Earthing Image" accept=".jpg,.jpeg,.png,.gif,.bmp" onchange={handleFileUpload} data-section="earthing"
                                                                class="slds-var-m-bottom_medium">
                                                            </lightning-input>

                                                            <!-- Uploaded Images Preview -->
                                                            <template if:true={earthingImages.length}>
                                                                <div class="image-preview-container">
                                                                    <h4 class="slds-text-heading_x-small slds-var-m-bottom_small">Uploaded Earthing Images:</h4>
                                                                    <div class="slds-grid slds-wrap slds-gutters">
                                                                        <template for:each={earthingImages} for:item="image">

                                            <div class="slds-text-color_error slds-var-m-top_xx-small" style="font-size: 0.75rem;">
                                                {fieldValidationErrors.Output_Air_Pressure__c}
                                            </div>
                                        </template>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="3" class="slds-var-p-horizontal_x-small">

                                            onchange={handleChange}></lightning-input>
                                        <template if:true={fieldValidationErrors.Head_out_time_ms__c}>
                                            <div class="slds-text-color_error slds-var-m-top_xx-small" style="font-size: 0.75rem;">
                                                {fieldValidationErrors.Head_out_time_ms__c}
                                            </div>
                                        </template>
                                    </lightning-layout-item>
                                    <!-- Row 5: Head In Time, Start Border Trim, End Border Trim, Darkness -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="3" class="slds-var-p-horizontal_x-small">
                                        <lightning-input name="Head_In_Time__c" label="Head In Time (ms)" type="number" required={isTTO} variant="label-stacked" value={installationReportRecord.Head_In_Time__c}
                                            onchange={handleChange}></lightning-input>
                                        <template if:true={fieldValidationErrors.Head_In_Time__c}>
                                            <div class="slds-text-color_error slds-var-m-top_xx-small" style="font-size: 0.75rem;">
                                                {fieldValidationErrors.Head_In_Time__c}
                                            </div>
                                        </template>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="3" class="slds-var-p-horizontal_x-small">
                                        <lightning-input name="Start_Border_Trim__c" label="Start Border Trim (mm)" type="number" required={isTTO} variant="label-stacked" value={installationReportRecord.Start_Border_Trim__c}
                                            onchange={handleChange}></lightning-input>
                                        <template if:true={fieldValidationErrors.Start_Border_Trim__c}>
                                            <div class="slds-text-color_error slds-var-m-top_xx-small" style="font-size: 0.75rem;">
                                                {fieldValidationErrors.Start_Border_Trim__c}
                                            </div>
                                        </template>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="3" class="slds-var-p-horizontal_x-small">
                                        <lightning-input name="End_Border_Trim__c" label="End Border Trim (mm)" type="number" required={isTTO} variant="label-stacked" value={installationReportRecord.End_Border_Trim__c}
                                            onchange={handleChange}></lightning-input>
                                        <template if:true={fieldValidationErrors.End_Border_Trim__c}>
                                            <div class="slds-text-color_error slds-var-m-top_xx-small" style="font-size: 0.75rem;">
                                                {fieldValidationErrors.End_Border_Trim__c}
                                            </div>
                                        </template>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="3" class="slds-var-p-horizontal_x-small">
                                        <lightning-input name="Darkness__c" label="Darkness" type="number" required={isTTO} variant="label-stacked" value={installationReportRecord.Darkness__c}
                                            onchange={handleChange}></lightning-input>
                                        <template if:true={fieldValidationErrors.Darkness__c}>
                                            <div class="slds-text-color_error slds-var-m-top_xx-small" style="font-size: 0.75rem;">
                                                {fieldValidationErrors.Darkness__c}
                                            </div>
                                        </template>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </lightning-card>
                        </lightning-layout-item>

                        <!-- Engineer Remarks Section -->
                        <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small">
                            <lightning-card title="Engineer Remarks" icon-name="utility:note">
                                <lightning-layout multiple-rows>
                                    <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field required={isTTO} field-name="Engineer_Remarks__c" variant="label-stacked" value={installationReportRecord.Engineer_Remarks__c}
                                            onchange={handleChange}></lightning-input-field>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </lightning-card>
                        </lightning-layout-item>

                        <!-- Installation Status Section -->
                        <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small">
                            <lightning-card title="Installation Status" icon-name="utility:success">
                                <lightning-layout multiple-rows>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field required={isTTO} field-name="Installation_Status__c" variant="label-stacked" value={installationReportRecord.Installation_Status__c}
                                            onchange={handleChange}></lightning-input-field>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input 
                                            type="date" 
                                            label="Next Visit Proposed Date" 
                                            required={isTTO}
                                            variant="label-stacked" 
                                            value={installationReportRecord.Next_Visit_Proposed_Date__c}
                                            min={minNextVisitDate}
                                            message-when-range-underflow="Next Visit Proposed Date must be a future date (after today)"
                                            onchange={handleChange}
                                            name="Next_Visit_Proposed_Date__c">
                                        </lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </lightning-card>
                        </lightning-layout-item>

                        <!-- Action Buttons -->
                        <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small slds-text-align_center slds-var-p-bottom_small">
                            <div style="display: flex; justify-content: center">
                                <lightning-button label="Capture Signature" variant="brand-outline" class="slds-var-p-bottom_small" onclick={handleOpenCaptureSignatureClick}></lightning-button>
                            </div>
                            <lightning-button label="Save" variant="brand" class="slds-var-p-horizontal_x-small" onclick={handleSave}></lightning-button>
                            <lightning-button label="Preview PDF" variant="brand-outline" class="slds-var-p-horizontal_x-small" onclick={handlePreviewPDF}
                                disabled={isPreviewAndSendDisabled}></lightning-button>
                            <lightning-button label="Send Email" variant="brand-outline" class="slds-var-p-horizontal_x-small" onclick={handleSendEmail}
                                disabled={isPreviewAndSendDisabled}></lightning-button>
                        </lightning-layout-item>

                        </lightning-layout>
                    </template>
                </lightning-record-edit-form>
            </lightning-card>
        </div>
    </template>


    <!--  -->
    <template if:true={isSignatureModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title">Customer Signature</h2>
                    <lightning-button-icon
                        icon-name="utility:close"
                        onclick={handleSignatureModalCancelClick}
                        variant="bare"
                        class="slds-modal__close"
                        alternative-text="Close">
                    </lightning-button-icon>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-record-edit-form
                        object-api-name={currentObjectApiName}
                        record-id={currentReportRecord.Id}>
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small">
                                <c-signature-pad
                                    enable-name-signing="true"
                                    name-input-label="Customer Contact Name"
                                    enable-signature-drawing="true"
                                    pad-label="Signature"
                                    stroke-thickness="2"
                                    pen-color="black"
                                    pad-color="white"
                                    existing-input-text={currentReportRecord.Signature_by__c}
                                    existing-signature={currentReportRecord.Signature__c}
                                    is-remote-support={isRemoteSupport}
                                    font="30px 'Great Vibes'"
                                    oninput={drawText}>
                                </c-signature-pad>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small">
                                <lightning-input
                                    name="Customer_Email__c"
                                    label="Customer Email"
                                    type="email"
                                    onchange={handleChange}
                                    required={isRemoteSupport}
                                    variant="label-stacked"
                                    value={currentReportRecord.Customer_Email__c}>
                                </lightning-input>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small">
                                <lightning-input
                                    name="Customer_Contact_Number__c"
                                    label="Customer Contact Number"
                                    type="tel"
                                    onchange={handleChange}
                                    required={isRemoteSupport}
                                    variant="label-stacked"
                                    value={currentReportRecord.Customer_Contact_Number__c}
                                    pattern="[0-9]{10}"
                                    message-when-pattern-mismatch="Please enter a valid 10-digit mobile number">
                                </lightning-input>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small">
                                <lightning-input
                                    name="Customer_Designation__c"
                                    label="Customer Designation"
                                    onchange={handleChange}
                                    required={isRemoteSupport}
                                    variant="label-stacked"
                                    value={currentReportRecord.Customer_Designation__c}>
                                </lightning-input>
                            </lightning-layout-item>
                            <!-- Service Rating is only applicable for Service Report, so render it conditionally -->
                            <template if:true={showServiceReport}>
                            <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small">
                                    <div class="rating-container">
                                        <label class="slds-form-element__label">Service Rating</label>
                                        <div class="rating-icons">
                                            <template for:each={serviceRatingScale} for:item="item">
                                                <span
                                                    key={item.storedValue}
                                                    class={item.cssClass}
                                                    data-value={item.storedValue}
                                                    onclick={handleServiceRatingClick}
                                                    title={item.label}
                                                >
                                                    {item.icon}
                                                </span>
                                            </template>
                                        </div>
                                    </div>
                            </lightning-layout-item>
                            </template>
                            <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small">
                                <lightning-input-field
                                    field-name="Customer_Remark__c"
                                    label="Customer Feedback"
                                    variant="label-stacked"
                                    onchange={handleChange}
                                    value={currentReportRecord.Customer_Remark__c}
                                    disabled={isRemarkFilled}>
                                </lightning-input-field>
                            </lightning-layout-item>
                        </lightning-layout>
                    </lightning-record-edit-form>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button
                        class="slds-var-p-horizontal_x-small"
                        variant="brand"
                        label="Capture"
                        onclick={handleSignatureModalCaptureClick}>
                    </lightning-button>
                    <!-- <lightning-button class="slds-var-p-horizontal_x-small" variant="neutral" label="Clear" onclick={handleSignatureModalClearClick}></lightning-button> -->
                    <lightning-button
                        class="slds-var-p-horizontal_x-small"
                        variant="neutral"
                        label="Cancel"
                        onclick={handleSignatureModalCancelClick}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>


    <!--  -->
    <template if:true={showServiceReport}>
        <div class="container-max-width service-report-page">
            <lightning-card title="Service Report">
                <lightning-record-edit-form if:true={serviceReportRecord} object-api-name="Service_Report__c" record-id={serviceReportRecord.Id} onload={handleOnLoad} onsubmit={handleServiceReportSave}>
                    <lightning-layout pull-to-boundary="stretch" vertical-align="start" multiple-rows>

                        <!-- Document Number Section -->
                        <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small">
                            <lightning-card title="Document Information" icon-name="utility:info" class="section-card">
                                <lightning-layout multiple-rows>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-output-field if:true={serviceReportRecord.IsSavedByUser__c} field-name="Name" variant="label-stacked"></lightning-output-field>
                                        <lightning-input if:false={serviceReportRecord.IsSavedByUser__c} label="Service Report Number" variant="label-stacked" required disabled></lightning-input>
                                    </lightning-layout-item>
                                    <!-- <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-output-field if:true={serviceReportRecord.IsSavedByUser__c} field-name="Case__c" variant="label-stacked"></lightning-output-field>
                                        <lightning-input if:false={serviceReportRecord.IsSavedByUser__c} field-name="Case__c" variant="label-stacked" value={serviceReportRecord.Case__c}
                                            disabled></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-output-field if:true={serviceReportRecord.IsSavedByUser__c} field-name="Product__c" variant="label-stacked"></lightning-output-field>
                                        <lightning-input if:false={serviceReportRecord.IsSavedByUser__c} field-name="Product__c" variant="label-stacked" value={serviceReportRecord.Product__c}
                                            disabled></lightning-input>
                                    </lightning-layout-item> -->

                                    <!-- Customer Name (pre-populated, read only) -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field class="readonly-field" required="true" field-name="Customer_Name__c" variant="label-stacked"
                                            value={serviceReportRecord.Customer_Name__c} onchange={handleChange} disabled>
                                        </lightning-input-field>
                                    </lightning-layout-item>
                                    
                                    <!-- Party Code (pre-populated, read only) -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field class="readonly-field" required="true" field-name="Party_Code__c" variant="label-stacked"
                                            value={serviceReportRecord.Party_Code__c} onchange={handleChange} disabled>
                                        </lightning-input-field>
                                    </lightning-layout-item>
                                    
                                    <!-- Contact Person (pre-populated, read only) -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field class="readonly-field" field-name="Contact_Person__c" variant="label-stacked"
                                            value={serviceReportRecord.Contact_Person__c} onchange={handleChange} disabled>
                                        </lightning-input-field>
                                    </lightning-layout-item>
                                    
                                    <!-- Customer Contact Number (pre-populated, read only) -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field class="readonly-field" field-name="Customer_Contact_Number__c" variant="label-stacked"
                                            value={serviceReportRecord.Customer_Contact_Number__c} onchange={handleChange} disabled>
                                        </lightning-input-field>
                                    </lightning-layout-item>

                                    <!-- Next Visit Proposed Date -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input 
                                            type="date" 
                                            label="Next Visit Proposed Date" 
                                            variant="label-stacked" 
                                            value={serviceReportRecord.Next_Visit_Proposed_Date__c}
                                            min={minNextVisitDate}
                                            message-when-range-underflow="Next Visit Proposed Date must be a future date (after today)"
                                            onchange={handleChange}
                                            name="Next_Visit_Proposed_Date__c">
                                        </lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </lightning-card>
                        </lightning-layout-item>

                        <!-- ACCORDION: Basic Information -->
                        <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small">
                            <div class="accordion-container">
                                <div class="accordion-section">
                                    <div class="accordion-header" onclick={toggleAccordion} data-section="basicInfo">
                                        <lightning-icon icon-name="utility:info" size="small" class="slds-var-m-right_x-small"></lightning-icon>
                                        <span class="accordion-title">Basic Information</span>
                                        <lightning-icon icon-name={basicInfoIcon} size="small" class="accordion-icon"></lightning-icon>
                                    </div>
                                    <div data-section="basicInfo" class={basicInfoContentClass}>
                                        <lightning-layout multiple-rows>

                                            <!-- Sr. No. (pre-populated, read only) -->
                                            <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                                <lightning-input-field class="readonly-field" field-name="Sr_No__c" variant="label-stacked"
                                                    value={serviceReportRecord.Sr_No__c} onchange={handleChange} disabled>
                                                </lightning-input-field>
                                            </lightning-layout-item>

                                            <!-- Software No -->
                                            <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                                <lightning-input name="Software_No__c" label="Software No" variant="label-stacked" required="true"
                                                    value={serviceReportRecord.Software_No__c} onchange={handleChange}
                                                    pattern="^[a-zA-Z0-9\s\-\_\.\/\#\@\&\!\$\*\(\)\[\]\{\}]+$"
                                                    message-when-pattern-mismatch="Only alphanumeric characters and special characters are allowed">
                                                </lightning-input>
                                            </lightning-layout-item>

                                            <!-- Complaint Details (textarea) -->
                                            <lightning-layout-item size="12" small-device-size="12" medium-device-size="12" large-device-size="12" class="slds-var-p-horizontal_x-small">
                                                <lightning-input-field required="true" field-name="Complaint_Details__c" variant="label-stacked" value={serviceReportRecord.Complaint_Details__c}
                                                    onchange={handleChange}>
                                                </lightning-input-field>
                                            </lightning-layout-item>

                                            <!-- Type of Service (pre-populated from Case, read only) -->
                                            <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                                <lightning-input-field class="readonly-field" field-name="Type_of_Service__c" variant="label-stacked"
                                                    value={serviceReportRecord.Type_of_Service__c} onchange={handleChange} disabled>
                                                </lightning-input-field>
                                            </lightning-layout-item>

                                            <template lwc:if={isCIJ}>

                                                <!-- Customer Application -->
                                                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                                    <lightning-input-field required="true" field-name="Customer_Application__c" variant="label-stacked" value={serviceReportRecord.Customer_Application__c}
                                                        onchange={handleChange}>
                                                    </lightning-input-field>
                                                </lightning-layout-item>
                                            
                                                <!-- CIJ Model No (pre-populated, read only) -->
                                                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                                    <lightning-input-field class="readonly-field" field-name="CIJ_Model_No__c" variant="label-stacked"
                                                        value={serviceReportRecord.CIJ_Model_No__c} onchange={handleChange} disabled>
                                                    </lightning-input-field>
                                                </lightning-layout-item>                            

                                                <!-- Pump Run Hours -->
                                                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                                    <lightning-input-field required="true" field-name="Pump_Run_Hours__c" variant="label-stacked" value={serviceReportRecord.Pump_Run_Hours__c} onchange={handleChange}>
                                                    </lightning-input-field>
                                                </lightning-layout-item>


                                                <!-- Product Counter -->
                                                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                                    <lightning-input-field required="true" field-name="Product_Counter__c" variant="label-stacked" value={serviceReportRecord.Product_Counter__c} onchange={handleChange}>
                                                    </lightning-input-field>
                                                </lightning-layout-item>

                                                <!-- Nozzle Serial No -->
                                                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                                    <lightning-input name="Nozzle_Serial_No__c" label="Nozzle Serial No" variant="label-stacked" required={isFirstServiceReport}
                                                        value={serviceReportRecord.Nozzle_Serial_No__c} onchange={handleChange}
                                                        pattern="^[a-zA-Z0-9\s\-\_\.\/\#\@\&\!\$\*\(\)\[\]\{\}]+$"
                                                        message-when-pattern-mismatch="Only alphanumeric characters and special characters are allowed">

                                                </lightning-layout-item>

                                            <template lwc:elseif={isTIJ}>

                                                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                                    <lightning-input-field required="true" field-name="Customer_Application__c" variant="label-stacked" value={serviceReportRecord.Customer_Application__c}
                                                        onchange={handleChange}>
                                                    </lightning-input-field>
                                                </lightning-layout-item>
                                                <!-- TIJ Model Number (pre-populated, read only) -->
                                                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                                    <lightning-input-field class="readonly-field" field-name="TIJ_Model_No__c" variant="label-stacked" onchange={handleChange}
                                                        value={serviceReportRecord.TIJ_Model_No__c} disabled></lightning-input-field>
                                                </lightning-layout-item>

                                                <!--  ink cartridge part -->
                                                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                                    <lightning-input-field required="true" field-name="Ink_Cartridge_Part__c" variant="label-stacked" value={serviceReportRecord.Ink_Cartridge_Part__c}
                                                        onchange={handleChange}>
                                                    </lightning-input-field>
                                                </lightning-layout-item>

                                                <!-- Product Counter -->
                                                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                                    <lightning-input-field required="true" field-name="Product_Counter__c" variant="label-stacked" value={serviceReportRecord.Product_Counter__c} onchange={handleChange}>
                                                    </lightning-input-field>
                                                </lightning-layout-item>
                                                
                                                <!-- Cartridge Exp Date -->
                                                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                                    <lightning-input-field required="true" field-name="Cartridge_Exp_Date__c" variant="label-stacked" value={serviceReportRecord.Cartridge_Exp_Date__c} onchange={handleChange}>
                                                    </lightning-input-field>
                                                </lightning-layout-item>
                                            </template>

                                                            {fieldValidationErrors.Darkness__c}
                                                        </div>
                                                    </template>
                                                </lightning-layout-item>
                                            </lightning-layout>
                                        </div>
                                    </div>
                                </div>
                            </lightning-layout-item>
                        </template>
                        <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small">
                            <lightning-card title="Document Information" icon-name="utility:info">
                                <lightning-layout multiple-rows>
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field required="true" field-name="Customer_Problem_Statement__c" variant="label-stacked" value={serviceReportRecord.Customer_Problem_Statement__c}
                                            onchange={handleChange}>
                                        </lightning-input-field>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field required="true" field-name="Root_Cause_Analysis__c" variant="label-stacked" value={serviceReportRecord.Root_Cause_Analysis__c} onchange={handleChange}>
                                        </lightning-input-field>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field required="true" field-name="Action_Taken__c" variant="label-stacked" value={serviceReportRecord.Action_Taken__c} onchange={handleChange}>
                                        </lightning-input-field>
                                    </lightning-layout-item>

                                    <!-- M/C Breakdown (Y/N) -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="4" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field field-name="MC_Breakdown__c" variant="label-stacked"
                                            value={serviceReportRecord.MC_Breakdown__c} onchange={handleChange}>
                                        </lightning-input-field>
                                    </lightning-layout-item>

                                    <!-- M/C Temporary Down (Y/N) -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="4" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field field-name="MC_Temporary_Down__c" variant="label-stacked"
                                            value={serviceReportRecord.MC_Temporary_Down__c} onchange={handleChange}>
                                        </lightning-input-field>
                                    </lightning-layout-item>

                                    <!-- M/C Running (Y/N) -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="4" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field field-name="MC_Running__c" variant="label-stacked"
                                            value={serviceReportRecord.MC_Running__c} onchange={handleChange}>
                                        </lightning-input-field>
                                    </lightning-layout-item>

                                    <!-- Complaint Status (pre-populated from Case Status, read only) -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field
                                            class="readonly-field"
                                            required="true"
                                            field-name="Complaint_Status__c"
                                            variant="label-stacked"
                                            value={serviceReportRecord.Complaint_Status__c}
                                            onchange={handleChange}
                                            disabled>
                                        </lightning-input-field>
                                    </lightning-layout-item>

                                    <!-- Customer’s Comments -->
                                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_x-small">
                                        <lightning-input-field required="true" field-name="Customers_Comments__c" variant="label-stacked" value={serviceReportRecord.Customers_Comments__c} onchange={handleChange}>
                                        </lightning-input-field>
                                    </lightning-layout-item>

                                </lightning-layout>
                            </lightning-card>
                        </lightning-layout-item>

                        <lightning-layout-item size="12" class="slds-var-p-horizontal_x-small slds-text-align_center slds-var-p-bottom_small">
                            <div style="display: flex; justify-content: center">
                                <lightning-button label="Capture Signature" variant="brand-outline" class="slds-var-p-bottom_small" onclick={handleOpenCaptureSignatureClick}></lightning-button>
                            </div>
                            <lightning-button label="Save" variant="brand" class="slds-var-p-horizontal_x-small" type="submit"></lightning-button>
                            <lightning-button label="Preview PDF" variant="brand-outline" class="slds-var-p-horizontal_x-small" onclick={handlePreviewPDF}
                                disabled={isPreviewAndSendDisabled}></lightning-button>
                            <lightning-button label="Send Email" variant="brand-outline" class="slds-var-p-horizontal_x-small" onclick={handleSendEmail}
                                disabled={isPreviewAndSendDisabled}></lightning-button>
                        </lightning-layout-item>
                    </lightning-layout>
                </lightning-record-edit-form>
            </lightning-card>
        </div>
    </template>
</template>
