<template>
    <lightning-layout multiple-rows vertical-align="stretch" horizontal-align="spread">
        <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small">
            <lightning-card title="Assets Moving from Warranty to Out of Warranty (Next 60 Days)">
                <div class="slds-m-around_medium">
                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
                    </template>

                    <template if:true={noWarrantyRecords}>
                        <lightning-layout>
                            <lightning-layout-item size="2"></lightning-layout-item>
                            <lightning-layout-item size="8">
                                <img src="/img/chatter/OpenRoad.svg" class="slds-illustration__svg slds-var-p-around_large" />
                                <p style="text-align: center; font-size: large;">No Warranty Expiry Data Available.</p>
                            </lightning-layout-item>
                            <lightning-layout-item size="2"></lightning-layout-item>
                        </lightning-layout>
                    </template>

                    <template if:true={warrantyList.length}>
                        <template for:each={warrantyList} for:item="rsmGroup">
                            <div key={rsmGroup.rsmId} class="slds-box slds-m-bottom_medium">
                                <h2 class="slds-text-heading_medium slds-m-bottom_small">{rsmGroup.rsmName}</h2>
                                <div class="slds-scrollable_x table-container">
                                    <table class="slds-table slds-table_bordered slds-table_col-bordered slds-table_fixed-layout">
                                        <thead>
                                            <tr class="slds-text-title_caps">
                                                <th scope="col">Serial Number</th>
                                                <!-- <th>Account Name</th> -->
                                                <th scope="col">Pin Code</th>
                                                <th scope="col">Warranty Start Date</th>
                                                <th scope="col">Warranty End Date</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={rsmGroup.assets} for:item="asset">
                                                <tr key={asset.assetId}>
                                                    <td>{asset.serialNumber}</td>
                                                    <!-- <td>{asset.serialNumber}</td> -->
                                                    <td>{asset.pinCodeName}</td>
                                                    <td>{asset.warrantyStartDate}</td>
                                                    <td>{asset.warrantyEndDate}</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </template>
                    </template>
                </div>
            </lightning-card>
        </lightning-layout-item>


        <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6">
            <lightning-card title="AMC Renewal RSM Wise in Next 60 Days" class="full-width">
                <template if:true={showSpinner}>
                    <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
                </template>
                <template if:true={hasNoShWiseAssets}>
                    <lightning-layout>
                        <lightning-layout-item size="2" small-device-size="2" medium-device-size="3" large-device-size="3"></lightning-layout-item>
                        <lightning-layout-item size="8" small-device-size="8" medium-device-size="6" large-device-size="6">
                            <img src="/img/chatter/OpenRoad.svg" class="slds-illustration__svg slds-var-p-around_large" />
                            <p style="text-align: center; font-size: large;">No AMC Renewal Assets.</p>
                        </lightning-layout-item>
                        <lightning-layout-item size="2" small-device-size="2" medium-device-size="3" large-device-size="3"></lightning-layout-item>
                    </lightning-layout>
                </template>
                <template if:true={shWiseAssets.length}>
                    <template for:each={shWiseAssets} for:item="sh">
                        <div key={sh.rsmId} class="slds-box slds-m-bottom_medium">
                            <h2 class="slds-text-heading_medium slds-m-bottom_small">{sh.rsmName}</h2>
                            <div class="slds-scrollable_x table-container">
                                <table class="slds-table slds-table_bordered slds-no-row-hover slds-table_col-bordered slds-table_fixed-layout slds-table_cell-buffer">
                                    <thead>
                                        <tr class="slds-text-title_caps">
                                            <th scope="col">Serial Number</th>
                                            <th scope="col">Account Name</th>
                                            <th scope="col">Pincode Name</th>
                                            <th scope="col">AMC Start Date</th>
                                            <th scope="col">AMC End Date</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={sh.assets} for:item="asset">
                                            <tr key={asset.assetId}>
                                                <td>{asset.serialNumber}</td>
                                                <td>{asset.accountName}</td>
                                                <td>{asset.pinCodeName}</td>
                                                <td>{asset.amcStartDate}</td>
                                                <td>{asset.amcEndDate}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </template>
                </template>
            </lightning-card>
        </lightning-layout-item>


        <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6">
            <lightning-card title="AMC Not Renewed in Last 90 Days (RSM-wise)">
                <!-- Spinner -->
                <template if:true={showSpinner}>
                    <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
                </template>

                <!-- No data SVG -->
                <template if:true={hasNoAMCData}>
                    <lightning-layout>
                        <lightning-layout-item size="2" small-device-size="2" medium-device-size="3" large-device-size="3"></lightning-layout-item>
                        <lightning-layout-item size="8" small-device-size="8" medium-device-size="6" large-device-size="6">
                            <img src="/img/chatter/OpenRoad.svg" class="slds-illustration__svg slds-var-p-around_large" />
                            <p style="text-align: center; font-size: large;">No AMC Renewal Assets.</p>
                        </lightning-layout-item>
                        <lightning-layout-item size="2" small-device-size="2" medium-device-size="3" large-device-size="3"></lightning-layout-item>
                    </lightning-layout>
                </template>

                <!-- Data rendering -->
                <template if:true={amcNotRenewedData}>
                    <template for:each={amcNotRenewedData} for:item="rsm">
                        <div key={rsm.rsmId} class="slds-box slds-m-bottom_medium">
                            <h2 class="slds-text-heading_medium slds-m-bottom_small">{rsm.rsmName}</h2>
                            <div class="slds-scrollable_x table-container">
                                <table class="slds-table slds-table_bordered slds-no-row-hover slds-table_col-bordered slds-table_fixed-layout slds-table_cell-buffer">
                                    <thead>
                                        <tr class="slds-text-title_caps">
                                            <th>Serial Number</th>
                                            <th>Account Name</th>
                                            <th>Pin Code</th>
                                            <th>AMC Start Date</th>
                                            <th>AMC End Date</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={rsm.assets} for:item="asset">
                                            <tr key={asset.assetId}>
                                                <td>{asset.serialNumber}</td>
                                                <td>{asset.accountName}</td>
                                                <td>{asset.pinCodeName}</td>
                                                <td>{asset.amcStartDate}</td>
                                                <td>{asset.amcEndDate}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </template>
                </template>
            </lightning-card>
        </lightning-layout-item>

        <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6">
            <lightning-card title="AMC Conversion Records in Last 90 Days">

                <template if:true={showSpinner}>
                    <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
                </template>

                <template if:true={noWarrantyConversionData}>
                    <lightning-layout>
                        <lightning-layout-item size="2" small-device-size="2" medium-device-size="3" large-device-size="3"></lightning-layout-item>
                        <lightning-layout-item size="8" small-device-size="8" medium-device-size="6" large-device-size="6">
                            <img src="/img/chatter/OpenRoad.svg" class="slds-illustration__svg slds-var-p-around_large" />
                            <p style="text-align: center; font-size: large;">No Warranty to AMC Conversion Records in Last 90 Days.</p>
                        </lightning-layout-item>
                        <lightning-layout-item size="2" small-device-size="2" medium-device-size="3" large-device-size="3"></lightning-layout-item>
                    </lightning-layout>
                </template>

                <!-- <template if:true={rsmWarrantyList}>
                    <template for:each={rsmWarrantyList} for:item="rsm">
                        <lightning-card key={rsm.rsmId} title={rsm.rsmName}>
                            <template for:each={rsm.assets} for:item="asset">
                                <div key={asset.assetId} class="slds-box slds-m-around_x-small">
                                    <p><strong>Serial Number:</strong> {asset.serialNumber}</p>
                                    <p><strong>Account:</strong> {asset.accountName}</p>
                                    <p><strong>Pin Code:</strong> {asset.pinCodeName}</p>
                                    <p><strong>Warranty Start:</strong> {asset.warrantyStartDate}</p>
                                    <p><strong>Warranty End:</strong> {asset.warrantyEndDate}</p>
                                </div>
                            </template>
                        </lightning-card>
                    </template>
                </template> -->
                <!-- <template if:true={rsmWarrantyList.length}> -->
                <template for:each={rsmWarrantyList} for:item="rsm">
                    <div key={rsm.rsmId} class="slds-box slds-m-bottom_medium">
                        <h2 class="slds-text-heading_medium slds-m-bottom_small">{rsm.rsmName}</h2>
                        <div class="slds-scrollable_x table-container">
                            <table class="slds-table slds-table_bordered slds-no-row-hover slds-table_col-bordered slds-table_fixed-layout slds-table_cell-buffer">
                                <thead>
                                    <tr class="slds-text-title_caps">
                                        <th scope="col">Serial Number</th>
                                        <th scope="col">Account Name</th>
                                        <th scope="col">Pincode Name</th>
                                        <th scope="col">AMC Start Date</th>
                                        <th scope="col">AMC End Date</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={rsm.assets} for:item="asset">
                                        <tr key={asset.assetId}>
                                            <td>{asset.serialNumber}</td>
                                            <td>{asset.accountName}</td>
                                            <td>{asset.pinCodeName}</td>
                                            <td>{asset.warrantyStartDate}</td>
                                            <td>{asset.warrantyEndDate}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </template>
                <!-- </template> -->
            </lightning-card>
        </lightning-layout-item>

        <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6">
            <lightning-card title="RSM-wise Business Revenue">
                <template if:true={showSpinner}>
                    <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
                </template>

                <template if:true={noRevenueData}>
                    <lightning-layout>
                        <lightning-layout-item size="2" small-device-size="2" medium-device-size="3" large-device-size="3"></lightning-layout-item>
                        <lightning-layout-item size="8" small-device-size="8" medium-device-size="6" large-device-size="6">
                            <img src="/img/chatter/OpenRoad.svg" class="slds-illustration__svg slds-var-p-around_large" />
                            <p style="text-align: center; font-size: large;">No Business Revenue Data Available.</p>
                        </lightning-layout-item>
                        <lightning-layout-item size="2" small-device-size="2" medium-device-size="3" large-device-size="3"></lightning-layout-item>
                    </lightning-layout>
                </template>

                <template if:true={rsmRevenueList.length}>
                    <div class="slds-scrollable_x table-container">
                        <table class="slds-table slds-table_bordered slds-no-row-hover slds-table_col-bordered slds-table_fixed-layout slds-table_cell-buffer">
                            <thead>
                                <tr class="slds-text-title_caps">
                                    <th scope="col">RSM Name</th>
                                    <th scope="col">Financial Year</th>
                                    <th scope="col">Sales Goal</th>
                                    <th scope="col">Sales Achievement</th>
                                    <th scope="col">Teams Goal</th>
                                    <th scope="col">Teams Achievement</th>
                                    <th scope="col">Business Verticals</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={rsmRevenueList} for:item="item">
                                    <tr key={item.rsmId}>
                                        <td>{item.rsmName}</td>
                                        <td>{item.financialYear}</td>
                                        <td>{item.salesGoal}</td>
                                        <td>{item.salesAchievement}</td>
                                        <td>{item.teamsGoal}</td>
                                        <td>{item.teamsAchievement}</td>
                                        <td>{item.businessVerticals}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
            </lightning-card>
        </lightning-layout-item>

        <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6">
            <lightning-card title="AMC Business (Current FY)">
                <div class="slds-m-around_medium">
                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                    </template>

                    <template if:true={isDataAvailable}>
                        <lightning-layout>
                            <lightning-layout-item size="2" small-device-size="2" medium-device-size="3" large-device-size="3"></lightning-layout-item>
                            <lightning-layout-item size="8" small-device-size="8" medium-device-size="6" large-device-size="6">
                                <img src="/img/chatter/OpenRoad.svg" class="slds-illustration__svg slds-var-p-around_large" />
                                <p style="text-align: center; font-size: large;">No AMC Business Data Available.</p>
                            </lightning-layout-item>
                            <lightning-layout-item size="2" small-device-size="2" medium-device-size="3" large-device-size="3"></lightning-layout-item>
                        </lightning-layout>
                    </template>

                    <template if:true={amcBusinessData.length}>
                        <template for:each={amcBusinessData} for:item="rsmInfo">
                            <div key={rsmInfo.rsmId} class="slds-box slds-m-bottom_medium slds-scrollable_x table-container">
                                <h3 class="slds-text-heading_medium">{rsmInfo.rsmName}</h3>
                                <table class="slds-table slds-table_bordered slds-no-row-hover slds-table_col-bordered slds-table_fixed-layout slds-table_cell-buffer">
                                    <thead>
                                        <tr>
                                            <th scope="col">New AMCs (₹)</th>
                                            <th scope="col">Renewed AMCs (₹)</th>
                                            <th scope="col">AMCs within 90 Days of Warranty Expiry (₹)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>{rsmInfo.invoiceAmountOfNewAMCs}</td>
                                            <td>{rsmInfo.invoiceAmountOfRenewedAMCs}</td>
                                            <td>{rsmInfo.invoiceAmountOfAMCWhichGotWithin90DaysOfWarrantyExpiry}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                    </template>
                </div>
            </lightning-card>
        </lightning-layout-item>
        <!--  -->
        <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small">
            <lightning-card title="Returnable Quotes">
                <template if:true={showSpinner}>
                    <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
                </template>
                <template if:true={hasNoReturnableQuoteLines}>
                    <lightning-layout>
                        <lightning-layout-item size="2" small-device-size="2" medium-device-size="3" large-device-size="3"></lightning-layout-item>
                        <lightning-layout-item size="8" small-device-size="8" medium-device-size="6" large-device-size="6">
                            <img src="/img/chatter/OpenRoad.svg" class="slds-illustration__svg slds-var-p-around_large" />
                            <p style="text-align: center; font-size: large;">No Returnable Quotes Available.</p>
                        </lightning-layout-item>
                        <lightning-layout-item size="2" small-device-size="2" medium-device-size="3" large-device-size="3"></lightning-layout-item>
                    </lightning-layout>
                </template>

                <template if:true={returnableQuoteLines.length}>
                    <div class="table-container">
                        <!-- <table class="slds-table slds-table_bordered slds-table_cell-buffer"> -->
                        <table class="slds-table slds-table_bordered slds-table_col-bordered slds-table_fixed-layout">
                            <thead>
                                <tr class="slds-text-title_caps">
                                    <th scope="col">Customer Name</th>
                                    <th scope="col">Material Code</th>
                                    <th scope="col">Material Description</th>
                                    <th scope="col">Quantity</th>
                                    <th scope="col">Amount</th>

                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={returnableQuoteLines} for:item="qt">
                                    <tr key={qt.id}>
                                        <td>{qt.customerName}</td>
                                        <td>{qt.materialCode}</td>
                                        <td>{qt.materialDescription}</td>
                                        <td>{qt.quantity}</td>
                                        <td>{qt.amount}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <!-- <template if:true={error}>
                        <div class="slds-text-color_error">{error.body.message}</div>
                    </template> -->
            </lightning-card>
        </lightning-layout-item>
        <!--  -->


    </lightning-layout>


</template>
