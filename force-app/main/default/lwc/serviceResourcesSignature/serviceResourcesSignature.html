<template>
    <!-- Modal -->
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <h2 id="modal-heading-01" class="slds-text-heading_medium">Signature Pad</h2>
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                </header>

                <!-- Modal Content -->
                <div class="slds-modal__content slds-p-vertical_medium" id="modal-content-id-1">
                    <lightning-layout style="display: flex;flex-direction: column;">
                        <lightning-layout-item size="12" small-device-size="12" medium-device-size="12" large-device-size="12" class="slds-var-p-horizontal_small">
                            <div style="height: 200px;">
                                <c-signature-pad enable-name-signing="false" name-input-label="Signature:" enable-signature-drawing="true" pad-label="Draw signature here:" stroke-thickness="2"
                                    pen-color="black" pad-color="white" font="30px 'Great Vibes'" oninput={drawText}></c-signature-pad>
                            </div>
                            <!-- <div class="slds-m-top_small" style="text-align: center;">
                                <lightning-button variant="brand-outline" label="Clear" title="Clear" onclick={clearSignature} class="slds-m-left_x-small"></lightning-button>
                            </div> -->
                        </lightning-layout-item>

                        <!-- <lightning-layout-item size="12" small-device-size="12" medium-device-size="12" large-device-size="12" class="slds-var-p-horizontal_small">
                            <div class="slds-m-top_small" style="text-align: center;">
                                <lightning-button variant="brand" label="Save" title="Save" onclick={saveSignature}></lightning-button>
                            </div>
                        </lightning-layout-item> -->
                    </lightning-layout>
                </div>

                <!-- Modal Footer (Optional) -->
                <footer class="slds-modal__footer">
                    <lightning-button variant="brand" label="Save" title="Save" onclick={saveSignature} class="slds-m-horizontal_small"></lightning-button>
                    <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
