<template>
    <lightning-card>
        <lightning-record-edit-form object-api-name="Spare_Material_Request__c" onsuccess={handleSuccess} onsubmit={handleSubmit}>
            <center><b>New Material Code Request</b></h3>
            </center>
            <lightning-messages> </lightning-messages>
            <lightning-layout multiple-rows="true">

                <lightning-layout-item size="12" small-device-size="12" large-device-size="2" class="slds-var-p-horizontal_small">
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_small">
                    <lightning-input-field field-name="Material_Description__c" required></lightning-input-field>
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_small">
                    <!-- <lightning-input-field field-name="Material_Required_Date__c" required></lightning-input-field> -->
                    <lightning-input-field field-name="OEM_Material_Code__c" required></lightning-input-field>
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" large-device-size="2" class="slds-var-p-horizontal_small">
                </lightning-layout-item>

                <lightning-layout-item size="12" small-device-size="12" large-device-size="2" class="slds-var-p-horizontal_small">
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_small">
                    <lightning-input-field field-name="Case__c" value={caseId} disabled="True"></lightning-input-field>
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_small">
                    <lightning-input-field field-name="Status__c" value={CaseStatus} disabled="True"></lightning-input-field>
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" large-device-size="2" class="slds-var-p-horizontal_small">
                </lightning-layout-item>

                <lightning-layout-item size="12" small-device-size="12" large-device-size="2" class="slds-var-p-horizontal_small">
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_small">
                    <lightning-input label="Material Code" value={materialCode} disabled="True"></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_small">
                    <lightning-input label="Asset Serial Number" value={serialNo} disabled="True"></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" large-device-size="2" class="slds-var-p-horizontal_small">
                </lightning-layout-item>


                <lightning-layout-item size="12" small-device-size="12" large-device-size="2" class="slds-var-p-horizontal_small">
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_small slds-form-element_horizontal">
                    <label class="slds-form-element__label" for="file-upload" style="margin-left: 0.5em;">File Upload</label>
                    <lightning-input type="file" accept=".png, .pdf" onchange={openfileUpload}></lightning-input>
                    <template if:true={fileData}>
                        <p>{fileData.filename}</p>
                    </template>
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="4" class="slds-var-p-horizontal_small">

                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" large-device-size="2" class="slds-var-p-horizontal_small">
                </lightning-layout-item>
                <lightning-layout-item size="12" class="slds-var-p-horizontal_small slds-text-align_center">
                    <lightning-button type="submit" label="Submit" variant="brand" class="slds-var-p-horizontal_small"></lightning-button>
                    <lightning-button label="Cancel" variant="brand-outline" class="slds-var-p-horizontal_small" onclick={cancelAction}></lightning-button>
                </lightning-layout-item>
            </lightning-layout>
        </lightning-record-edit-form>

    </lightning-card>
</template>
