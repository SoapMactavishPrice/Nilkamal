<template>

    <!-- <lightning-card icon-name="standard:work_order" title="Items to Approve"> -->

    <div style="display: flex; align-items: center; border-bottom: 1px solid gray" class="slds-p-around_x-small">
        <lightning-icon icon-name="action:submit_for_approval" size="x-small"></lightning-icon>
        <div class="slds-var-p-left_medium">
            <template if:true={isDesktop}>
                <div class="slds-text-heading_medium slds-var-p-top_x-small">Items For Action</div>
                <div class="slds-text-heading_xx-small">
                    <template lwc:if={recordList}>{recordList.length}<template if:true={hasMoreRecords}>+</template></template>
                    <template lwc:else>0</template>
                    &nbsp;Items
                </div>
            </template>
            <template if:false={isDesktop}>
                <div class="slds-text-heading_small">Items to Action</div>
                <div class="slds-text-heading_xx-small">
                    <template lwc:if={recordList}>{recordList.length}<template if:true={hasMoreRecords}>+</template></template>
                    <template lwc:else>0</template>
                    &nbsp;Items
                </div>
            </template>
        </div>
    </div>

    <template lwc:if={recordList}>
        <template lwc:if={isDesktop}>
            <div class="datatable-container">
                <c-extended-datatable style="height: 75vh" columns={columns} data={recordList} key-field="id" enable-infinite-loading onloadmore={handleLoadMoreData} hide-checkbox-column
                    show-row-number-column onrowaction={handleRowAction} column-widths-mode="auto"></c-extended-datatable>
            </div>
        </template>


        <template lwc:else>
            <div class="mobile-card-container">
                <div class="mobile-scroll-container" onscroll={handleMobileScroll}>
                    <template for:each={recordList} for:item="record">
                        <div key={record.id} class="mobile-card" onclick={handleMobileCardClick} data-id={record.caseId}>
                            <div class="slds-p-horizontal_small slds-p-vertical_small">
                                <div class="slds-text-title_bold slds-truncate" title={record.relatedToName}>{record.relatedToName}</div>

                                <div class="slds-grid slds-wrap slds-text-body_small">
                                    <div class="slds-col slds-size_1-of-3 slds-truncate">Case Number:</div>
                                    <div class="slds-col slds-size_2-of-3 slds-truncate">{record.caseNumber}</div>
                                    <div class="slds-col slds-size_1-of-3 slds-truncate">Case Owner:</div>
                                    <div class="slds-col slds-size_2-of-3 slds-truncate">{record.caseOwnerName}</div>
                                    <div class="slds-col slds-size_1-of-3 slds-truncate">First Comment:</div>
                                    <lightning-formatted-rich-text class="slds-col slds-size_2-of-3" value={record.firstCommentBody}>
                                    </lightning-formatted-rich-text>
                                    <div class="slds-col slds-size_1-of-3 slds-truncate">First Comment By:</div>
                                    <lightning-formatted-rich-text class="slds-col slds-size_2-of-3" value={record.firstCommentByText}>
                                    </lightning-formatted-rich-text>
                                    <div class="slds-col slds-size_1-of-3 slds-truncate">Last Comment:</div>
                                    <lightning-formatted-rich-text class="slds-col slds-size_2-of-3" value={record.latestCommentBody}>
                                    </lightning-formatted-rich-text>
                                    <div class="slds-col slds-size_1-of-3 slds-truncate">Last Comment By:</div>
                                    <lightning-formatted-rich-text class="slds-col slds-size_2-of-3" value={record.latestCommentByText}>
                                    </lightning-formatted-rich-text>
                                </div>
                            </div>
                        </div>
                    </template>

                    <template if:true={isLoading}>
                        <div class="slds-align_absolute-center slds-p-around_medium">Loading...</div>
                    </template>
                </div>
            </div>
        </template>
    </template>


    <template lwc:else>
        <lightning-layout style="align-items: center; height: 60vh;">
            <lightning-layout-item size="3" small-device-size="3" medium-device-size="4" large-device-size="4">
            </lightning-layout-item>
            <lightning-layout-item size="6" small-device-size="6" medium-device-size="4" large-device-size="4">
                <img src="/img/chatter/OpenRoad.svg" class="slds-illustration__svg slds-var-p-around_large" />
            </lightning-layout-item>
            <lightning-layout-item size="3" small-device-size="3" medium-device-size="4" large-device-size="4">
            </lightning-layout-item>
        </lightning-layout>
    </template>


</template>
