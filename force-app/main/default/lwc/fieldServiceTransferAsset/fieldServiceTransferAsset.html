<template>

    <template if:true={showSpinner}>
        <lightning-spinner alternative-text="Loading" variant="brand" size="medium"></lightning-spinner>
    </template>


    <div class="container-max-width">

        <lightning-card hide-header label="Asset Transfer">

            <lightning-layout multiple-rows hide-header>

                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3" class="slds-var-p-horizontal_small">
                    <template if:true={AssetId}>
                        <lightning-record-picker name="AssetId" object-api-name="Asset" label="Asset (Serial Number)" placeholder="Search by Serial Number" value={AssetId}
                            display-info={assetBySerialDisplayInfo} matching-info={assetBySerialMatchingInfo} onchange={handleFieldChange} data-name="AssetId" data-type="RecordPicker" required>
                        </lightning-record-picker>
                    </template>
                    <template if:false={AssetId}>
                        <lightning-record-picker name="AssetId" object-api-name="Asset" label="Asset (Serial Number)" placeholder="Search by Serial Number" value={AssetId}
                            display-info={assetBySerialDisplayInfo} matching-info={assetBySerialMatchingInfo} onchange={handleFieldChange} data-name="AssetId" data-type="RecordPicker" required>
                        </lightning-record-picker>
                    </template>
                </lightning-layout-item>


                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3" class="slds-var-p-horizontal_small">
                    <template if:true={AccountId}>
                        <lightning-record-picker name="AccountId" object-api-name="Account" label="Bill to Customer Name" placeholder="Bill to Customer Name" value={AccountId}
                            display-info={customerByNameDisplayInfo} matching-info={customerByNameMatchingInfo} onchange={handleFieldChange} data-name="AccountId" data-type="RecordPicker" disabled>
                        </lightning-record-picker>
                    </template>
                    <template if:false={AccountId}>
                        <lightning-record-picker name="AccountId" object-api-name="Account" label="Bill to Customer Name" placeholder="Bill to Customer Name" value={AccountId}
                            display-info={customerByNameDisplayInfo} matching-info={customerByNameMatchingInfo} onchange={handleFieldChange} data-name="AccountId" data-type="RecordPicker" disabled>
                        </lightning-record-picker>
                    </template>

                    <lightning-layout if:true={addressDetails.AccountId} multiple-rows vertical-align="center">
                        <lightning-layout-item size="4" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">Bill to Customer Code</lightning-layout-item>
                        <lightning-layout-item size="8" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">{addressDetails.AccountId.customerCode}</lightning-layout-item>

                        <lightning-layout-item size="4" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">Bill To Address</lightning-layout-item>
                        <lightning-layout-item size="8" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">{addressDetails.AccountId.address}</lightning-layout-item>

                        <lightning-layout-item size="4" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">Bill To City</lightning-layout-item>
                        <lightning-layout-item size="8" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">{addressDetails.AccountId.city}</lightning-layout-item>

                        <lightning-layout-item size="4" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">Bill To Region</lightning-layout-item>
                        <lightning-layout-item size="8" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">{addressDetails.AccountId.region}</lightning-layout-item>

                        <lightning-layout-item size="4" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">Bill To PinCode</lightning-layout-item>
                        <lightning-layout-item size="8" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">{addressDetails.AccountId.pinCode}</lightning-layout-item>

                        <lightning-layout-item size="4" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">Bill To Country</lightning-layout-item>
                        <lightning-layout-item size="8" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">{addressDetails.AccountId.country}</lightning-layout-item>
                    </lightning-layout>
                </lightning-layout-item>


                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3" class="slds-var-p-horizontal_small">
                    <template if:true={End_Customer__c}>
                        <lightning-record-picker name="End_Customer__c" object-api-name="Account" label="Ship to Customer Name" placeholder="Ship to Customer Name" value={End_Customer__c}
                            display-info={shipToByNameDisplayInfo} matching-info={shipToByNameMatchingInfo} onchange={handleFieldChange} data-name="End_Customer__c" data-type="RecordPicker" disabled>
                        </lightning-record-picker>
                    </template>
                    <template if:false={End_Customer__c}>
                        <lightning-record-picker name="End_Customer__c" object-api-name="Account" label="Ship to Customer Name" placeholder="Ship to Customer Name" value={End_Customer__c}
                            display-info={shipToByNameDisplayInfo} matching-info={shipToByNameMatchingInfo} onchange={handleFieldChange} data-name="End_Customer__c" data-type="RecordPicker" disabled>
                        </lightning-record-picker>
                    </template>

                    <lightning-layout if:true={addressDetails.End_Customer__c} multiple-rows vertical-align="center">
                        <lightning-layout-item size="4" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">Ship to Customer Code</lightning-layout-item>
                        <lightning-layout-item size="8" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">{addressDetails.End_Customer__c.customerCode}</lightning-layout-item>

                        <lightning-layout-item size="4" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">Ship To Address</lightning-layout-item>
                        <lightning-layout-item size="8" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">{addressDetails.End_Customer__c.address}</lightning-layout-item>

                        <lightning-layout-item size="4" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">Ship To City</lightning-layout-item>
                        <lightning-layout-item size="8" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">{addressDetails.End_Customer__c.city}</lightning-layout-item>

                        <lightning-layout-item size="4" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">Ship To Region</lightning-layout-item>
                        <lightning-layout-item size="8" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">{addressDetails.End_Customer__c.region}</lightning-layout-item>

                        <lightning-layout-item size="4" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">Ship To PinCode</lightning-layout-item>
                        <lightning-layout-item size="8" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">{addressDetails.End_Customer__c.pinCode}</lightning-layout-item>

                        <lightning-layout-item size="4" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">Ship To Country</lightning-layout-item>
                        <lightning-layout-item size="8" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">{addressDetails.End_Customer__c.country}</lightning-layout-item>
                    </lightning-layout>
                </lightning-layout-item>


                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3" class="slds-var-p-horizontal_small">
                    <template if:true={ContactId}>
                        <lightning-record-picker name="ContactId" object-api-name="Contact" label="Contact" placeholder="Contact" value={ContactId} display-info={contactDisplayInfo}
                            matching-info={contactMatchingInfo} onchange={handleFieldChange} data-name="ContactId" data-type="RecordPicker" disabled>
                        </lightning-record-picker>
                    </template>
                    <template if:false={ContactId}>
                        <lightning-record-picker name="ContactId" object-api-name="Contact" label="Contact" placeholder="Contact" value={ContactId} display-info={contactDisplayInfo}
                            matching-info={contactMatchingInfo} onchange={handleFieldChange} data-name="ContactId" data-type="RecordPicker" disabled>
                        </lightning-record-picker>
                    </template>

                    <lightning-layout if:true={addressDetails.ContactId} multiple-rows vertical-align="center">
                        <lightning-layout-item size="4" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">Mobile Number</lightning-layout-item>
                        <lightning-layout-item size="8" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">{addressDetails.ContactId.mobilePhone}</lightning-layout-item>

                        <lightning-layout-item size="4" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">Email Id</lightning-layout-item>
                        <lightning-layout-item size="8" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">{addressDetails.ContactId.email}</lightning-layout-item>
                    </lightning-layout>
                </lightning-layout-item>


            </lightning-layout>

        </lightning-card>

    </div>

                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3" class="slds-var-p-horizontal_small">

                    </template>

                        <lightning-record-picker name="New_End_Customer__c" object-api-name="Account" label="Ship to Customer Name (New)" value={New_End_Customer__c} display-info={accountDisplayInfo}
                            matching-info={accountMatchingInfo} onchange={handleFieldChange} data-type="RecordPicker" data-name="New_End_Customer__c" required>

                    </template>

                    <lightning-layout if:true={addressDetails.New_End_Customer__c} multiple-rows vertical-align="center">

                        <lightning-layout-item size="8"
                            class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">{addressDetails.New_End_Customer__c.customerCode}</lightning-layout-item>

                        <lightning-layout-item size="4" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">Ship To Address</lightning-layout-item>
                        <lightning-layout-item size="8" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">{addressDetails.New_End_Customer__c.address}</lightning-layout-item>

                        <lightning-layout-item size="4" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">Ship To City</lightning-layout-item>
                        <lightning-layout-item size="8" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">{addressDetails.New_End_Customer__c.city}</lightning-layout-item>

                        <lightning-layout-item size="4" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">Ship To Region</lightning-layout-item>

                            matching-info={contactMatchingInfo} onchange={handleFieldChange} data-type="RecordPicker" data-name="New_ContactId" required>

                        <lightning-layout-item size="8" class="slds-var-p-top_x-small slds-var-p-horizontal_xx-small force-wrap">{addressDetails.New_ContactId.mobilePhone}</lightning-layout-item>
